[project]
name = "video-pipeline"
version = "0.1.0"
description = "Автоматический конвейер генерации коротких вертикальных роликов (60-75 сек)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiohttp-socks>=0.10,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  # Claude через vibecode.moe: шлюз отдаёт claude-* только на /v1/messages
  # (формат Anthropic), см. app/services/anthropic_messages.py.
  "anthropic>=1.1,<2",
  "fastapi>=0.115,<1",
  "ffmpeg-python>=0.2,<1",
  "greenlet>=3.0,<4",
  "httpx[socks]>=0.27,<1",
  "jinja2>=3.1,<4",
  "loguru>=0.7,<1",
  "openpyxl>=3.1,<4",
  "pillow>=10.0,<12",
  "pypdf>=5,<7",
  "playwright>=1.48,<2",
  "pydantic>=2.9,<3",
  # Подпись сессионного токена студии. Разбирать её руками — тот самый
  # случай, где своя реализация дешевле ошибается: `alg: none` и подмена
  # алгоритма (`app/services/studio_auth.py`).
  "pyjwt>=2.9,<3",
  # Хеширование паролей (`app/services/passwords.py`). НЕ bcrypt: тот молча
  # обрезает пароль на 72 байтах, и парольная фраза из русских слов усекается
  # вдвое без единого предупреждения. argon2id длину не ограничивает и
  # настраивается по памяти, а не только по времени.
  "argon2-cffi>=23.1,<26",
  "pydantic-settings>=2.6,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6.0,<7",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.1,<3",
  "tiktoken>=0.8,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
# Heavy (~100MB+). Studio UI works without it; install when you need audio/word timestamps:
#   pip install -e ".[whisper]"
whisper = [
  "faster-whisper>=1.0,<2",
]
# NVIDIA NeMo Parakeet (ASR_BACKEND=nvidia) — ПК монтажа с CUDA:
#   pip install -e ".[nvidia]"
nvidia = [
  "nemo_toolkit[asr]>=2.3,<3",
  "torch>=2.1,<3",
  "huggingface_hub>=0.23,<1",
]
# Postgres (SaaS-режим, DATABASE_URL=postgresql+asyncpg://...):
#   pip install -e ".[postgres]"
# asyncpg — рабочий драйвер приложения; psycopg — синхронный, им alembic
# гонит миграции вне event loop.
postgres = [
  "asyncpg>=0.29,<1",
  "psycopg[binary]>=3.1,<4",
]
# Объектное хранилище (S3-совместимое: Cloudflare R2 и прочие):
#   pip install -e ".[s3]"
# Без ключей доступа не нужен вовсе — работает локальный диск узла.
# boto3, а не свой подписыватель: SigV4 это криптография, и ручная
# реализация ошибается тихо (docs/SAAS-PIVOT.md §9.2).
s3 = [
  "boto3>=1.34,<2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  # Покрытие собирается тем же прогоном, что и храповик суиты
  # (`.claude/verify.json`, шаг pytest-ratchet). Профиль сбора — в
  # [tool.coverage.run] ниже; без `concurrency = greenlet` цифры занижены.
  "pytest-cov>=5,<8",
  "ruff>=0.7",
  "mypy>=1.12",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
# SQLAlchemy 2.0 mypy plugin — без него AsyncSession.* методы (sync/async)
# неразличимы и mypy ругается «unused-coroutine» на session.delete(obj).
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = false
# W1: AsyncSession stubs не различают sync/async методы — false positive
# на session.delete(obj), session.expire(obj), session.expunge(obj) и т.п.
# Реальный код корректен (метод sync, не await). 6 вхождений — слишком
# шумно для per-line ignore, отключаем до фикса stubs.
disable_error_code = ["unused-coroutine"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line-length задан (110); B008: FastAPI Depends() — паттерн (FP);
# SIM10x/SIM11x: SIM-семейство — косметика (style-only), включая:
#   SIM102 (collapsible-if), SIM103 (needless-bool), SIM105 (try/pass),
#   SIM108 (if-else-ternary), SIM115 (open-with-context), SIM117
#   (combine with). W1-fix: 38 косметических упрощений, профит нулевой,
#   риск регрессии при авто-рефакторе ненулевой — отключаем до явного
#   спроса.
# E402: function-level imports для разрыва циклов — базовый паттерн.
# B023 (function-uses-loop-variable): паттерн «def внутри for с capture
#   внешней переменной» — в кодовой базе используется КОРРЕКТНО (capture
#   по ссылке на контейнер, не на индекс). Проверено: gpt_api._append_line
#   (loop-локальные контейнеры), generate_hero._one (chars — весь список),
#   xlsx_step_runners._one (sem/bi_seq/batch_n — фабрики), db_browser lambda
#   (spec — snapshot до следующей итерации). Подавление per-line 14×
#   noqa многословно, реальных багов нет.
# UP042 (str, Enum → StrEnum): меняет str()/f-string всех статусов
#   («ProjectStatus.new» → «new») — логи, сравнения, сериализация. Не
#   косметика; включать только отдельным изменением с прогоном.
ignore = [
    "E501", "B008", "E402", "B023", "UP042",
    "SIM102", "SIM103", "SIM105", "SIM108", "SIM115", "SIM117",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  # W1-fix п.7: opt-out из центрального harness-гейта (auto_advance).
  # Тесты механики продвижения без on-disk артефактов помечают себя.
  "no_harness_gate: отключить harness_gate_disabled для теста",
]

[tool.coverage.run]
# SQLAlchemy asyncio исполняет обращения к базе внутри greenlet'ов
# (`greenlet_spawn`), а coverage.py по умолчанию за переключением greenlet не
# следит: всё, что идёт ПОСЛЕ первого `await session.<...>` в теле функции,
# остаётся неучтённым. Проявилось на `studio_auth.assert_not_revoked` —
# отчёт показывал строки непокрытыми, хотя тесты доказуемо проходили именно
# по ним. Без этой строки храповик покрытия ведётся по заниженным цифрам,
# то есть держит не то, что думает.
concurrency = ["greenlet", "thread"]
source = ["app"]
branch = false
omit = [
  "app/main.py",
  "*/__init__.py",
]
