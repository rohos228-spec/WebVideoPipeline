# Студия на VPS: приложение и обратный прокси с TLS.
#
# **Postgres здесь НЕТ намеренно — он стоит на самом хосте** (решение владельца
# 2026-08-25). Ставится один раз: `sudo ./setup-postgres.sh`. Обновление базы,
# её настройка и бэкап уходят к системному администратору и не зависят от того,
# что происходит с контейнерами.
#
# **Как контейнер достаёт базу.** Через смонтированный unix-сокет, а не по TCP.
# TCP потребовал бы поднять `listen_addresses`, открыть порт на интерфейсе
# docker-моста и разрешить его подсеть в `pg_hba.conf` — то есть завести
# слушающий сокет там, где его не было, и дальше следить, чтобы фаервол не
# отстал от docker. Смонтированный сокет не требует ничего из этого: TCP у базы
# остаётся выключенным, снаружи её не видно в принципе.
#
# Проверено связкой «база вне контейнера + приложение в контейнере»: миграции,
# импорт промт-библиотеки и проверка RLS проходят.
#
# Содержимое `deploy/studio/` кладётся в /opt/studio на VPS вместе с файлом
# окружения `env` (шаблон — `env.template`) и каталогом `prompts/`.
# Обновление делает `deploy.sh`, его же зовёт GitHub Actions по ssh.
#
# ВАЖНО: гонять compose руками только с `--env-file ./env` — файл назван `env`,
# а не `.env`, и без флага подстановка `${…}` не сработает.

name: studio

services:
  app:
    # Подставляет deploy.sh: дайджест из прогона, а не подвижный тег. Значение
    # по умолчанию — на случай ручного `docker compose up` на месте.
    image: ${STUDIO_IMAGE:-ghcr.io/multikco/video-pipeline:latest}
    restart: unless-stopped
    env_file:
      - ./env
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8765"
      # За прокси с TLS cookie сессии обязана быть Secure. Без TLS её ставить
      # нельзя — браузер молча не сохранит, и вход будет выглядеть сломанным.
      SESSION_COOKIE_SECURE: "true"
      TELEGRAM_ENABLED: "false"
    volumes:
      # Сокет хостового Postgres. Каталог, а не файл: postgres пересоздаёт
      # сокет при рестарте, и bind на сам файл после этого указывал бы в
      # никуда — контейнер пришлось бы перезапускать вслед за базой.
      - ${POSTGRES_SOCKET_DIR:-/var/run/postgresql}:/var/run/postgresql
      # Ролики, кадры, звук. Гигабайты — том, а не bind: снапшот тома снимается
      # одной командой, а bind-каталог на VPS однажды окажется на / без места.
      - app-data:/app/data
      - app-logs:/app/logs
      # Библиотека мастер-промтов. Намеренно вне git и вне образа: это
      # содержательная часть продукта, а образ уезжает в реестр. Читается
      # только на первом старте — дальше источник база (`prompt_library`),
      # поэтому монтируется на чтение.
      - ./prompts:/app/prompts:ro
    # Порт наружу НЕ публикуется: до приложения ходит только обратный прокси,
    # свой или хостовый. Публиковать 8765 значило бы отдать студию в интернет
    # без TLS — пароли открытым текстом.
    #
    # Хостовому Caddy контейнер виден по имени сети: подключите его к сети
    # `studio_default` и проксируйте на `app:8765`.
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 30s
      timeout: 5s
      # Дольше, чем было с базой в контейнере: `depends_on: service_healthy`
      # больше некому ждать. Если postgres на хосте ещё поднимается (перезагрузка
      # VPS), приложение упадёт на старте и его поднимет `restart: unless-stopped`
      # — на это нужен запас.
      start_period: 120s
      retries: 3
    # Конвейер льёт подробный журнал; без ограничения он съедает диск за
    # неделю, и узнают об этом по остановившейся студии.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  proxy:
    # Профиль, а не обычная служба: на хосте уже может стоять свой обратный
    # прокси. Так и вышло на боевом VPS — там с 2026-08 живёт `gpt-relay`,
    # и его Caddy держит 80/443. Второй Caddy рядом просто не поднимется:
    # «address already in use», причём студия при этом будет выглядеть
    # сломанной, хотя приложение цело.
    #
    #   свой прокси нужен:   docker compose --env-file ./env --profile proxy up -d
    #   прокси уже есть:     docker compose --env-file ./env up -d
    #
    # Во втором случае в существующий Caddy добавляется блок сайта с
    # `reverse_proxy` на контейнер студии — см. deploy/studio/README.md.
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN:?нужен STUDIO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
  app-logs:
  caddy-data:
  caddy-config:
