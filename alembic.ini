; Alembic for video-pipeline.
;
; URL is not set here: it is taken from app.settings.settings.db_url
; in migrations/env.py.
;
; Manual commands:
;   alembic revision -m "add X"
;   alembic upgrade head
;   alembic current
;   alembic history --verbose

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# File template: 0001_slug.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
