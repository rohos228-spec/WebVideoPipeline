; Alembic для video-pipeline.
;
; URL здесь НЕ задаётся: он берётся из `app.settings.settings.db_url`
; в migrations/env.py — иначе миграции и приложение разъехались бы по базам
; (SQLITE_PATH переопределяется в .env и в тестах).
;
; Обычная работа — через приложение: `_init_db` сам догоняет схему до head
; (см. app/db_migrations.py). Ручные команды:
;
;   alembic revision -m "add X"     # новая миграция
;   alembic upgrade head            # догнать
;   alembic current                 # где мы
;   alembic history --verbose

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Имя файла: 0001_slug.py — номер важнее даты, порядок читается глазами.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
