# Настройка gitleaks поверх стандартной.
#
# Нужна ровно из-за одного: файл `.gitleaksignore` состоит из отпечатков вида
# `<sha>:<путь>:<правило>:<строка>`, и сорокасимвольный hex в нём правило
# `generic-api-key` принимает за ключ. Добавить его собственный отпечаток в
# него же нельзя: любая правка файла даёт новый коммит, новый отпечаток и
# новое срабатывание — гонка без конца.
[extend]
useDefault = true

[allowlist]
description = "Исключения для служебных файлов и артефактов статической сборки web/out"
paths = [
    '''\.gitleaksignore''',
    '''web/out/''',
]
