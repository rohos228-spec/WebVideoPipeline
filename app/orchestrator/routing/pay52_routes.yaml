# Маршруты внутренних ходов оркестратора (WS5).
# D1/D6 по умолчанию НЕ подтверждены: fast-tier выключен, всё идёт strong high.
# Переопределение: ORCH_D1_CONFIRMED / ORCH_D6_CONFIRMED = 1|true|yes|on.

flags:
  d1_confirmed: false
  # Fast-tier выключен. Замер 06.11: gpt-6.1-sol low быстрее (5.0 с против 10.9 с на вызов),
  # но контроль упал 85/86 -> 79/86: просьбы про картинки кадров уходили в ответ вместо карточки.
  # glm-5.3-flash без ключа, claude-haiku на линии 52pay недоступен (400).
  d6_confirmed: false

timeouts_s:
  fast: 60
  strong: 300

retries: 2
backoff_base_s: 1.0

# call_batch не читает зазор из файла: старт параллельный, gap по умолчанию 0.
stagger_s:
  min: 0
  max: 0

spend:
  # D4: суб-бюджет внутренних ходов. Исчерпание → TaskStatus.waiting_approval,
  # ApprovalEvent.reason = budget_exhausted. Задачу это не валит.
  internal_sub_budget_usd: 10.0
  # Pipeline не входит в $10, но без своего потолка это обход лимита.
  pipeline_sub_budget_usd: 40.0

classifier:
  confidence_threshold: 0.8
  temperature: 0
  max_tokens: 120

providers:
  # База и ключ 52pay на живом хопе берутся из pay52_routes.resolve_text
  # и settings.pay52_base_url (PAY52_BASE_URL, дефолт https://api.52pay.com/v1).
  # Поля ниже — запас, пока модуля pay52_routes нет в дереве.
  52pay:
    api_key_env: PAY52_GPT_API_KEY
    base_url_env: PAY52_BASE_URL
    chat_path: /v1/chat/completions
    api: openai-chat
  kie:
    api_key_env: GPT_API_KEY
    alt_api_key_env: KIE_API_KEY
    base_url_env: GPT_BASE_URL
    default_base_url: https://api.kie.ai
    chat_path: /codex/v1/responses
    api: openai-responses
    relay_token_env: GPT_RELAY_TOKEN
  # Последний резерв: Kie временами отдаёт пустой поток, а ключ Vibecode есть в рабочем .env.
  vibecode:
    api_key_env: VIBECODE_API_KEY
    base_url_env: VIBECODE_BASE_URL
    default_base_url: https://vibecode.moe/v1
    chat_path: /chat/completions
    api: openai-chat

# До D1: primary gpt-6.1-sol high (52pay), затем Kie.
# После D1: claude-sonnet-5 → gpt-6.1-sol high → Kie.
# Fast (только после D6): glm-5.3-flash → claude-haiku-5-5 → strong. Без reasoning_effort=high.
# Wire-id 52pay режет resolve_text (gpt-6-1-sol → gpt-6.1-sol, ключ pay52_gpt_key).
# Kie — последний резерв, всегда stream. Слаг: settings.gpt_model (дефолт gpt-6-1-sol).
chains:
  fast:
    - model: gpt-6.1-sol
      provider: 52pay
      reasoning_effort: low
    - model: gpt-6-1-sol
      provider: kie
      reasoning_effort: low
    - delegate: strong
  strong_unconfirmed:
    - model: gpt-6.1-sol
      provider: 52pay
      reasoning_effort: high
    - model: gpt-6-1-sol
      provider: kie
      reasoning_effort: high
    - model: gpt-6.1-sol
      provider: vibecode
      reasoning_effort: high
  strong_confirmed:
    - model: claude-sonnet-5
      provider: 52pay
      reasoning_effort: high
    - model: gpt-6.1-sol
      provider: 52pay
      reasoning_effort: high
    - model: gpt-6-1-sol
      provider: kie
      reasoning_effort: high
    - model: gpt-6.1-sol
      provider: vibecode
      reasoning_effort: high

# Оценки USD / 1M токенов (сырые, без наценки ×3 UI). Уточнить по прайсу 52pay.
prices_usd_per_million:
  glm-5.3-flash: {prompt: 0.48, completion: 1.66, reasoning: 1.66}
  claude-haiku-5-5: {prompt: 0.08, completion: 0.35, reasoning: 0.35}
  claude-sonnet-5: {prompt: 1.38, completion: 6.90, reasoning: 6.90}
  claude-fable-5-1: {prompt: 6.90, completion: 34.50, reasoning: 34.50}
  gpt-6.1-sol: {prompt: 1.11, completion: 5.52, reasoning: 5.52}
  deepseek-v4.1-flash: {prompt: 0.90, completion: 3.60, reasoning: 3.60}
  default: {prompt: 1.0, completion: 4.0, reasoning: 4.0}
