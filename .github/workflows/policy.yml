# Политика и долг — второй забор, который нельзя обойти правкой гейта.
#
# Зачем отдельный workflow, когда есть CI. `ci.yml` намеренно не запускается
# на `main` (`branches-ignore`), чтобы не драться за раннеров с релизом, а
# `release.yml` игнорирует `.claude/**`, `docs/**` и `**/*.md`, чтобы правка
# документации не перезапускала студию. Пересечение этих двух правил давало
# дыру: push в `main`, меняющий ТОЛЬКО `.claude/verify.json`, не запускал
# ничего — то есть ослабление самого гейта было единственным изменением,
# которое сервер не проверял вовсе (находка панели моделей 2026-09-04).
#
# Этот прогон дешёвый (секунды, без зависимостей проекта) и идёт на КАЖДЫЙ
# push без исключений по путям. `pull_request` убран вместе с `ci.yml`
# (2026-09-14): он дублировал push-прогон того же коммита.
name: Политика

on:
  push:
  workflow_call: {}

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    name: Политика и долг
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # policy_check сверяет дифф с origin/main — нужна история.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Политика, долг, гигиена спек
        run: python3 scripts/policy_check.py

      # Целостность гейта (файлы на месте, проверки не выпотрошены)
      # проверяет сам policy_check.py — шагом выше. Отдельного inline-скрипта
      # здесь нет намеренно: heredoc внутри `run: |` приезжает с отступом и
      # ломает python, а дублировать логику в двух местах хуже, чем не иметь
      # её во втором.
