name: "VPS: выполнить скрипт"

# Пульт для разовых операций на сервере: скрипт приходит base64 строкой и
# выполняется от root. Нужен потому, что прямой SSH с рабочей машины
# периодически не отвечает: sshd забит перебором пароля. Раннер GitHub
# подключается по ключу стабильно.
on:
  workflow_dispatch:
    inputs:
      script_b64:
        description: "bash-скрипт в base64 (одна строка)"
        required: true
        type: string

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - name: Ключ SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Выполнить
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SCRIPT_B64: ${{ inputs.script_b64 }}
        run: |
          printf '%s' "$SCRIPT_B64" > /tmp/script.b64
          base64 -d /tmp/script.b64 > /tmp/remote.sh
          ssh -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" 'bash -s' < /tmp/remote.sh
