# Гейт на каждый push и pull request.
#
# Зеркалит `.claude/verify.json` — тот же набор проверок, что стоит локально на
# ярусах commit и push. Два отличия, и оба в пользу CI:
#
# 1. **Изоляция арендаторов реально проверяется.** `tests/test_rls_postgres.py`
#    на машине разработчика пропускается — нужен живой Postgres. Здесь он
#    поднимается сервисом, и двенадцать тестов, которые единственные могут
#    подтвердить, что чужая строка невидима, наконец исполняются на каждом
#    push. Локально их гоняют, когда вспомнят.
# 2. **Чистый чекаут.** Промт-библиотека намеренно вне git
#    (`.gitignore: prompts/*`), и на машине владельца она есть, а здесь — нет.
#    Именно поэтому гейт устроен храповиком: список известных падений лежит в
#    `.claude/baselines/pytest-failures.txt`, и красным становится только
#    появление нового. Требовать здесь зелёной суиты значит требовать
#    невозможного и получить отключённый гейт.
name: CI

on:
  # `main` намеренно исключён. Не потому что его не проверяют — наоборот:
  # `release.yml` вызывает ЭТОТ ЖЕ workflow как гейт
  # (`uses: ./.github/workflows/ci.yml`), и без сборки образ не уедет.
  #
  # Пока main был в списке, на каждый push поднималось два одинаковых набора
  # работ: один по push, другой из релиза. Они не просто дублировали друг
  # друга, а дрались за раннеров: 2026-08-26 релиз простоял в `pending`, пока
  # его же двойник занимал слоты. Плюс на main из-за `cancel-in-progress:
  # false` в группе держится один идущий и один ожидающий, и серия push'ей
  # отменяла ожидающих — проверялся первый коммит серии, а не последний.
  #
  # `pull_request` тоже убран (2026-09-14): у ветки и у её PR разные ref
  # (`refs/heads/x` против `refs/pull/N/merge`), группы concurrency не
  # совпадают, и каждый push в ветку с открытым PR гонял суиту дважды —
  # видно на странице проверок как пара (push) / (pull_request). Проверка
  # merge-коммита с main при этом теряется; её заменяет ff-политика: в main
  # уходит только ветка, уже стоящая на актуальном main.
  push:
    branches-ignore: ["main"]
  workflow_call: {}

# Новый push в ту же ветку отменяет предыдущий прогон: суита идёт десять минут,
# и держать очередь из устаревших прогонов незачем. Вызов из релиза
# (`workflow_call`) наследует ref вызывающего, то есть `refs/heads/main` — его
# обрывать нельзя, он кормит сборку образа.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Формат, стиль, типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks смотрит ИСТОРИЮ, а не рабочее дерево. При обычном
          # чекауте глубиной 1 он просканировал бы один коммит и радостно
          # сообщил, что всё чисто.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка
        run: pip install -e ".[dev,postgres,s3]"

      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app/ --ignore-missing-imports

      - name: Секреты в истории
        # Бинарник, а не `gitleaks/gitleaks-action@v2`.
        #
        # Обёртка-action платная для ОРГАНИЗАЦИЙ: первый же прогон здесь упал
        # с «[multikco] is an organization. License key is required.». Сам
        # gitleaks свободен, и всё, что делает обёртка, — скачивает его и
        # запускает. Делаем это сами: то же покрытие, без лицензии и без
        # зависимости от чужого релиза.
        #
        # Известные находки перечислены в `.gitleaksignore`; настоящая там
        # одна — VIBECODE_API_KEY, уехавший значением в `.env.example` и
        # оставшийся в истории. Он требует ротации у провайдера, а не
        # вычёркивания: копия истории есть у каждого, кто делал clone.
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --no-banner --redact --exit-code 1

  tests:
    name: Суита, храповик, изоляция
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vp
          POSTGRES_PASSWORD: vp
          POSTGRES_DB: vp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vp -d vp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Храповик покрытия и diff-cov сравнивают с базой ветки. Без истории
          # `git diff origin/main` не с чем считать.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: ffmpeg
        # На раннере его нет, а `pip install ffmpeg-python` ставит только
        # обёртку — сами бинарники приходят из системы. Без них
        # `verify_audio_file` не может позвать ffprobe, и падает
        # `test_generate_sfx_files_local`: файл сгенерирован, а проверить его
        # нечем. Поймано первым же прогоном в CI — на машине владельца и в
        # образе ffmpeg есть, и локально этого не видно.
        #
        # `apt-get update` — минута-полторы на каждый прогон, а индекс пакетов
        # в образе раннера и так свежий (образ пересобирается еженедельно).
        # Ставим без обновления; если индекс протух и пакет не нашёлся —
        # обновляем и повторяем. Сторонних actions для ffmpeg не берём:
        # чужой код с GITHUB_TOKEN ради минуты не стоит (политика §230).
        run: |
          set -euo pipefail
          if ! sudo apt-get install -y -qq --no-install-recommends ffmpeg; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffprobe -version | head -1

      - name: Установка
        run: pip install -e ".[dev,postgres,s3]"

      - name: Роль без суперпользователя
        # POSTGRES_USER образа — суперпользователь, а RLS его не касается по
        # определению: тесты изоляции прошли бы «зелёными», не проверив
        # ничего. Это худший исход из возможных, поэтому роль заводится
        # отдельная и обычная — схему она создаёт себе сама прогоном миграций
        # и потому владеет таблицами, а владельца достаёт FORCE ROW LEVEL
        # SECURITY.
        run: |
          PGPASSWORD=vp psql -h 127.0.0.1 -U vp -d vp \
            -c "create role app login password 'app'" \
            -c "grant all on schema public to app"

      - name: Голденсеты и конфигурация эвалов
        # Отдельным шагом до суиты: секунда на весь корпус, а ломается он от
        # правки контракта — такую поломку хочется видеть первой строкой в
        # отчёте, а не двенадцатой минутой прогона.
        run: |
          python -m pytest tests/test_prompt_goldens.py tests/test_eval_suites.py \
            -q -p no:cacheprovider

      - name: Изоляция арендаторов на живом Postgres
        # Единственная проверка, которую нельзя сделать на SQLite: политик RLS
        # в этом движке не существует физически. Локально она пропускается.
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/vp
        run: python -m pytest tests/test_rls_postgres.py -q -p no:cacheprovider

      - name: Миграции на пустой и унаследованной базе
        run: python -m pytest tests/test_db_migrations.py -q -p no:cacheprovider

      - name: Храповик суиты
        # Красное не растёт. Промт-библиотека вне git, поэтому здесь падает
        # больше тестов, чем на машине владельца, — и все они в базе.
        #
        # Без `--cov`: покрытие здесь никто не сверял (см. ниже), а трассировка
        # coverage замедляет суиту на треть. Снято 2026-09-14.
        run: |
          python scripts/pytest_ratchet.py -- -p no:cacheprovider

      # Покрытия здесь НЕТ намеренно — ни храповика, ни diff-cov, ни отчёта.
      #
      # Их база (`.claude/baselines/coverage.json`) снимается на машине
      # владельца, где промт-библиотека есть. В чекауте CI её нет — часть
      # тестов падает на отсутствии ДАННЫХ, соответствующий код не
      # исполняется, и покрытие честно ниже. Храповик увидел бы просадку и
      # покраснел бы на первом же прогоне, ничего не поймав.
      #
      # Держать две базы под две среды — значит держать две правды и однажды
      # сверить не ту. Поэтому покрытие остаётся на локальном ярусе push
      # (`.claude/verify.json`), где условия воспроизводимы, а CI отвечает за
      # то, что от среды не зависит: стиль, типы, секреты, контракты,
      # изоляцию и рост красноты.
      #
      # Вернуть сюда можно тогда, когда библиотека станет доступна прогону —
      # например, приедет артефактом или секретом. Тогда же вернётся `--cov`
      # и выгрузка отчёта артефактом.

  frontend:
    name: Фронт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Типы
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Никакого hex вне токенов
        # Правило из web/Design.md: ЛИТЕРАЛ цвета живёт в токен-файле и больше
        # нигде. Гейт стоит здесь, а не в ревью: разъезжается палитра тихо и
        # потом не собирается обратно.
        #
        # Токен-файлов два с возвратом старого канваса (7e0ca40): globals.css
        # (лист) и studio-theme.css (дизайн заказчика, скоуп body:has).
        # Потребление токена — `hsl(var(--x) / 0.4)` — литералом не считается,
        # поэтому ловим только числовое начало: `hsl(0 …`, `rgba(0,…`, hex.
        #
        # Граница строгости — по каталогам, не по файлам (перенос форка
        # заказчика 2026-09, спека merge-customer-fork §1.2). Каталоги студии
        # заказчика — его дизайн и его литералы (183 hex на момент переноса);
        # чинить их у себя значит сделать следующий перенос невозможным.
        # Наше — `app/`, `components/ui`, `components/{editors,pipeline,chat}`,
        # файлы верхнего уровня `components/`, `hooks/`, остальное `lib/` —
        # держится строго: литерал = красный гейт.
        working-directory: web
        run: |
          if grep -rIn --include='*.css' --include='*.tsx' --include='*.ts' \
               -E '#[0-9a-fA-F]{3,8}\b|rgba?\(\s*[0-9]|hsla?\(\s*[0-9.]' src/ \
             | grep -v -e 'globals.css' -e 'studio-theme.css' \
                       -e 'components/canvas/' \
                       -e 'components/gpt/' \
                       -e 'components/outsee/' \
                       -e 'components/inspector/' \
                       -e 'components/sidebar/' \
                       -e 'components/studio/' \
                       -e 'components/shell/' \
                       -e 'components/hitl/' \
                       -e 'components/frames/' \
                       -e 'components/baza/' \
                       -e 'components/fleet/' \
                       -e 'components/costs/' \
                       -e 'components/logs/' \
                       -e 'components/prompts/' \
                       -e 'components/orchestrator/' \
                       -e 'components/ui/dialog.tsx' \
                       -e 'components/ui/sheet.tsx' \
                       -e 'lib/outsee-catalog.ts' \
                       -e 'lib/node-model-catalog.ts' \
                       -e 'lib/kie-pricing.ts'; then
            echo "::error::найден цвет мимо токенов — значение переезжает в globals.css/studio-theme.css"
            exit 1
          fi

      - name: Сборка статики
        working-directory: web
        run: npm run build

      - name: Экспорт существует
        # `output: "export"` молча не срабатывает, если в дерево попал
        # серверный код (route handler, `dynamic`): сборка зелёная, а out/
        # пустой — и образ уезжает без интерфейса.
        run: test -d web/out && test -f web/out/index.html
