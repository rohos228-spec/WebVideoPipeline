name: CI (merge housepc -> main)

on:
  pull_request:
    branches: [main]
  push:
    branches: [test/merge-housepc]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -r requirements.txt
          pip install pytest ruff mypy httpx
      - name: ruff
        run: ruff check app tests scripts
      - name: mypy
        run: mypy app
      - name: pytest (включая QA-набор слияния)
        env:
          VIA_TEST_HOOKS: "1"
        run: pytest -q --maxfail=5 tests

  frontend:
    name: next lint + next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build (export в web/out)
        working-directory: web
        run: npm run build
      - name: Grep провайдеров по сборке
        run: python scripts/merge_checks/check_providers.py --out web/out
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out

  merge-checks:
    name: сверка node_step_params
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main
      - name: Сверка параметров нод main vs HEAD
        run: |
          python scripts/merge_checks/check_node_step_params.py \
            --base origin/main --head HEAD

  e2e:
    name: playwright (собранный фронт + бэкенд)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install backend
        run: |
          pip install -e ".[dev]" || pip install -r requirements.txt
          pip install uvicorn
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: web/out
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start backend (serves web/out)
        env:
          VIA_TEST_HOOKS: "1"
          VIA_AUTH_ENABLED: "1"
          YOOKASSA_MODE: sandbox
        run: |
          nohup python -m uvicorn app.web.api:create_app --factory \
            --host 127.0.0.1 --port 8765 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/ > /dev/null && break || sleep 1
          done
      - name: Seed QA user
        run: node e2e/scripts/seed-qa-user.mjs
      - name: Run Playwright
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8765
        run: npx playwright test
      - name: Grep провайдеров по ответам API
        run: python scripts/merge_checks/check_providers.py --out web/out --api http://127.0.0.1:8765
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            uvicorn.log
